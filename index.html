<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ghost Edits</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
</head>
<body>
<header class="nav">
  <a class="logo" id="name" href="#">GHOST EDITS</a>
  <input class="in" id="q" type="search" placeholder="Search edits…">
  <div class="more"><button class="dots" id="dots" aria-label="Menu" aria-expanded="false">⋮</button><a class="dd" id="dd" href="admin.html" hidden>Admin</a></div>
</header>
<section class="hero"><h1 id="title"></h1><p id="sub"></p></section>
<nav class="chips" id="chips"></nav>
<main class="grid" id="grid"></main>
<footer id="foot"></footer>
<div class="modal" id="modal"><div class="pbox" id="pbox"></div></div>
<script src="data.js"></script>
<script>
const $ = s => document.querySelector(s);
let D, cat = 'All', term = '', extra = new Set(), tm;

function player(c) {
  const v = parseVideo(c.url);
  $('#pbox').innerHTML = '<button class="x" aria-label="Close">×</button>' + (
    v.type === 'yt' ? `<iframe src="https://www.youtube.com/embed/${v.id}?autoplay=1" allow="autoplay;fullscreen" allowfullscreen></iframe>` :
    v.type === 'drive' ? `<iframe src="https://drive.google.com/file/d/${v.id}/preview" allow="autoplay;fullscreen" allowfullscreen></iframe>` :
    `<video src="${esc(v.url)}" controls autoplay playsinline></video>`);
  $('#modal').classList.add('open');
}
function closeP() { $('#modal').classList.remove('open'); $('#pbox').innerHTML = ''; }

function draw() {
  const s = D.settings;
  document.documentElement.style.setProperty('--ac', s.accent);
  document.title = s.name;
  $('#name').textContent = s.name; $('#title').textContent = s.title; $('#sub').textContent = s.sub; $('#foot').textContent = s.footer;
  $('#chips').innerHTML = ['All', ...D.cats].map(c => `<button class="chip ${c === cat ? 'on' : ''}">${esc(c)}</button>`).join('');
  const list = D.clips.filter(c => (cat === 'All' || c.cat === cat) && (c.title.toLowerCase().includes(term) || c.cat.toLowerCase().includes(term) || extra.has(c.cat.toLowerCase())));
  $('#grid').innerHTML = list.length ? list.map(c => {
    const t = c.thumb || parseVideo(c.url).thumb;
    return `<article class="clip" tabindex="0" data-id="${c.id}"><div class="thumb">${t ? `<img loading="lazy" src="${t}" alt="">` : ''}</div><h3>${esc(c.title)}</h3><small>${esc(c.cat)}</small></article>`;
  }).join('') : '<p class="msg">No edits here yet. Add some from the admin page.</p>';
}

document.addEventListener('click', e => {
  const ch = e.target.closest('.chip'); if (ch) { cat = ch.textContent; draw(); }
  const c = e.target.closest('.clip'); if (c) player(D.clips.find(x => x.id == c.dataset.id));
  if (e.target.closest('.x') || e.target.id === 'modal') closeP();
});
document.addEventListener('click', e => {
  const open = e.target.closest('#dots') ? $('#dd').hidden : false;
  $('#dd').hidden = !open; $('#dots').setAttribute('aria-expanded', open);
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeP(); });
$('#q').oninput = e => {
  term = e.target.value.trim().toLowerCase(); extra = new Set(); draw(); clearTimeout(tm);
  if (term.length < 3) return;
  tm = setTimeout(async () => {
    const d = await ani('query($s:String){Page(perPage:3){characters(search:$s){media(perPage:2,sort:POPULARITY_DESC){nodes{title{english romaji}}}}}}', {s: term}).catch(() => null);
    if (!d) return;
    d.Page.characters.forEach(c => c.media.nodes.forEach(n => extra.add((n.title.english || n.title.romaji).toLowerCase())));
    draw();
  }, 400);
};
Promise.all([loadData(), localAll()]).then(([d, l]) => { D = d; D.clips = d.clips.concat(l); D.cats = [...new Set([...d.cats, ...l.map(c => c.cat)])]; draw();
  if (D.error) $('#grid').insertAdjacentHTML('afterbegin', `<p class="msg" style="grid-column:1/-1">Could not read the database: ${esc(D.error)}. Check the Realtime Database rules.</p>`);
});
</script>
</body>
</html>
